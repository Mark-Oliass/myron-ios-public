name: ping
'on':
  workflow_dispatch: {}
jobs:
  x:
    runs-on: macos-15
    steps:
    - name: installed
      run: ls -d /Applications/Xcode*.app 2>/dev/null || echo none
    - name: list xcode 15
      run: "curl -sS -m 40 https://xcodereleases.com/data.json -o /tmp/x.json\ncat > /tmp/s.py <<'PY'\nimport json\nd = json.load(open(\"/tmp/x.json\"))\nfor r in d:\n    v = r.get(\"version\", {})\n    if str(v.get(\"major\")) == \"15\" and r.get(\"release\", {}).get(\"release\"):\n        url = (r.get(\"links\", {}).get(\"download\") or {}).get(\"url\")\n        print(\"XCODE15\", v.get(\"name\"), url)\nPY\npython3 /tmp/s.py"
