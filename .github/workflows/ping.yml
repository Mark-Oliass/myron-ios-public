name: xcode15test
'on':
  workflow_dispatch: {}
jobs:
  x:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
    - name: install xcodes
      run: brew install xcodesorg/made/xcodes
    - name: list installable
      run: xcodes list 2>&1 | grep -E '^15\.' | head -10
    - name: install Xcode 15.4
      run: xcodes install 15.4 --experimental-unxip || xcodes install 15.4
    - name: verify
      run: ls -d /Applications/Xcode*.app; xcodes installed
